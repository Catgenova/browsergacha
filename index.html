<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Gacha — Hero Battler</title>
  <link rel="stylesheet" href="css/style.css?v=f3393a81" />
</head>
<body>
  <div id="game-root">
    <!-- Top bar: nav + currency -->
    <header id="topbar">
      <div id="logo">BROWSER GACHA <span id="version-tag">v47 · f3393a81</span></div>
      <nav id="nav-tabs">
        <button class="nav-tab" data-screen="summon">Summon</button>
        <button class="nav-tab" data-screen="team">Team</button>
        <button class="nav-tab" data-screen="battle">Battle</button>
      </nav>
      <div id="gem-display">💎 <span id="gem-count">0</span></div>
      <button id="dev-gems-btn" class="panel-btn" title="Testing only: grants 1000 gems">+1000 💎</button>
    </header>

    <!-- ================= Summon screen ================= -->
    <section id="screen-summon" class="screen hidden">
      <div id="summon-header">
        <h2>Hero Summon</h2>
        <div class="summon-rates">Rates: 3★ 70% · 4★ 25% · 5★ 5% — ×10 guarantees a 4★+</div>
        <div id="pity-counter"></div>
        <div id="summon-actions">
          <button id="summon-one-btn" class="panel-btn">Summon ×1 (100 💎)</button>
          <button id="summon-ten-btn" class="panel-btn gold">Summon ×10 (900 💎)</button>
        </div>
        <div id="summon-error"></div>
      </div>
      <div id="summon-results"></div>
    </section>

    <!-- ================= Team builder screen ================= -->
    <section id="screen-team" class="screen hidden">
      <div id="team-top">
        <div id="team-canvas-wrap">
          <canvas id="team-canvas" width="560" height="400"></canvas>
          <div id="team-controls">
            <span id="team-count"></span>
            <button id="clear-team-btn" class="panel-btn danger">Clear team</button>
            <button id="fight-btn" class="panel-btn gold">Fight!</button>
          </div>
        </div>
        <aside id="hero-details"></aside>
      </div>
      <div id="roster-section">
        <h3>Your Heroes</h3>
        <div id="roster-grid"></div>
      </div>
    </section>

    <!-- ================= Battle screen ================= -->
    <section id="screen-battle" class="screen hidden">
      <div id="battle-wrap">
        <canvas id="battle-canvas" width="960" height="540"></canvas>

        <button id="auto-btn" class="panel-btn" title="Let your heroes fight automatically">Auto: OFF</button>

        <!-- Ability bar: shown when it's a player hero's turn -->
        <div id="ability-bar" class="hidden">
          <div id="active-hero-name"></div>
          <div id="ability-buttons"></div>
          <div id="target-hint" class="hidden">Select a target…</div>
        </div>

        <!-- End-of-battle banner -->
        <div id="battle-banner" class="hidden">
          <div id="banner-title"></div>
          <div id="banner-sub"></div>
          <button id="banner-return" class="panel-btn gold">Return to Team</button>
        </div>
      </div>

      <!-- Battle log -->
      <div id="battle-log"></div>
    </section>
  </div>

  <script src="js/config.js?v=f3393a81"></script>
  <script src="js/hex.js?v=f3393a81"></script>
  <script src="js/sprites.js?v=f3393a81"></script>
  <script src="js/abilities.js?v=f3393a81"></script>
  <script src="js/hero.js?v=f3393a81"></script>
  <script src="js/data/heroes.js?v=f3393a81"></script>
  <script src="js/data/enemies.js?v=f3393a81"></script>
  <script src="js/data/effects.js?v=f3393a81"></script>
  <script src="js/state.js?v=f3393a81"></script>
  <script src="js/gacha.js?v=f3393a81"></script>
  <script src="js/battle.js?v=f3393a81"></script>
  <script src="js/render.js?v=f3393a81"></script>
  <script src="js/ui.js?v=f3393a81"></script>
  <script src="js/battle_screen.js?v=f3393a81"></script>
  <script src="js/team_screen.js?v=f3393a81"></script>
  <script src="js/summon_screen.js?v=f3393a81"></script>
  <script src="js/main.js?v=f3393a81"></script>
</body>
</html>
