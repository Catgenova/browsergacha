<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser Gacha — Hero Battler</title>
  <link rel="stylesheet" href="css/style.css?v=49cc15d3" />
</head>
<body>
  <div id="game-root">
    <!-- Top bar: nav + currency -->
    <header id="topbar">
      <div id="logo">BROWSER GACHA <span id="version-tag">v160 · 49cc15d3</span></div>
      <nav id="nav-tabs">
        <button class="nav-tab" data-screen="summon">Summon</button>
        <button class="nav-tab" data-screen="team">Team</button>
        <button class="nav-tab" data-screen="blacksmith">Blacksmith</button>
        <button class="nav-tab" data-screen="quests">Quests<span id="quest-badge" class="hidden">•</span></button>
        <button class="nav-tab" data-screen="battle">Battle</button>
      </nav>
      <div id="scroll-display" title="Common · Rare · Temporal summon scrolls">📜 <span id="scroll-common-count">0</span> · ✨ <span id="scroll-rare-count">0</span> · 🌀 <span id="scroll-temporal-count">0</span></div>
      <div id="mat-display" title="Whetstones (item leveling) · Arcana (enchanting) · Skill Tomes (skill leveling, Endless Tower only)">🪨 <span id="whetstone-count">0</span> · ✦ <span id="arcana-count">0</span> · 📖 <span id="tome-count">0</span></div>
    </header>

    <!-- ================= Summon screen ================= -->
    <section id="screen-summon" class="screen hidden">
      <div id="summon-header">
        <h2>Hero Summon</h2>
        <div class="summon-rates">Common 📜: 1★ 60% · 2★ 30% · 3★ 10% &nbsp;|&nbsp; Rare ✨: 3★ 80% · 4★ 18% · 5★ 2%</div>
        <div class="summon-rates">Temporal 🌀 (Dark 🌙 &amp; Light ☀️ only): 1★ 30% · 2★ 30% · 3★ 25% · 4★ 12% · 5★ 3%</div>
        <div id="scroll-counts"></div>
        <div id="pity-counter"></div>
        <div id="summon-actions">
          <button id="summon-common-one" class="panel-btn">Common ×1 (1 📜)</button>
          <button id="summon-common-ten" class="panel-btn">Common ×10 (10 📜)</button>
          <button id="summon-rare-one" class="panel-btn gold">Rare ×1 (1 ✨)</button>
          <button id="summon-rare-ten" class="panel-btn gold">Rare ×10 (10 ✨)</button>
          <button id="summon-temporal-one" class="panel-btn danger">Temporal ×1 (1 🌀)</button>
          <button id="summon-temporal-ten" class="panel-btn danger">Temporal ×10 (10 🌀)</button>
        </div>
        <div id="summon-error"></div>
      </div>
      <div id="summon-results"></div>
    </section>

    <!-- ================= Team builder screen ================= -->
    <section id="screen-team" class="screen hidden">
      <div id="team-top">
        <div id="team-canvas-wrap">
          <canvas id="team-canvas" width="560" height="400"></canvas>
          <div id="wave-controls">
            <span class="wave-label">Hunt:</span>
            <select id="location-select" title="Battle location"></select>
            <select id="stage-select" title="Stage (sets enemy levels)"></select>
            <select id="repeat-select" title="How many battles to chain">
              <option value="1">×1</option>
              <option value="3">×3</option>
              <option value="5">×5</option>
              <option value="10">×10</option>
              <option value="inf">∞</option>
            </select>
          </div>
          <div id="boss-controls">
            <span class="wave-label">Boss:</span>
            <select id="boss-select" title="Which boss to challenge"></select>
            <select id="boss-stage-select" title="Boss stage — clear a stage to unlock the next"></select>
            <select id="boss-repeat-select" title="Repeats unlock once the stage is cleared">
              <option value="1">×1</option>
              <option value="3">×3</option>
              <option value="5">×5</option>
              <option value="10">×10</option>
              <option value="inf">∞</option>
            </select>
            <button id="boss-btn" class="panel-btn danger" title="Take on the boss with your current team">Boss!</button>
          </div>
          <div id="tower-controls">
            <span class="wave-label">Tower:</span>
            <span id="tower-status"></span>
            <button id="tower-btn" class="panel-btn gold" title="Climb the Endless Tower — every floor drops a Common Scroll, every 5th a Rare, every 20th Skill Tomes, every 50th a Temporal Scroll">Climb!</button>
          </div>
          <div id="team-controls">
            <span id="team-count"></span>
            <button id="clear-team-btn" class="panel-btn danger">Clear team</button>
            <button id="fight-btn" class="panel-btn gold">Fight!</button>
          </div>
          <div id="race-bonuses" class="hidden" title="Field 3/5/7 heroes of one race for stacking pack bonuses"></div>
        </div>
        <aside id="hero-details"></aside>
      </div>
      <div id="roster-section">
        <div id="roster-header">
          <h3>Your Heroes</h3>
          <input id="roster-search" type="search" placeholder="Search name or element…">
          <select id="roster-sort" title="Sort the roster">
            <option value="level">Sort: Level</option>
            <option value="stars">Sort: Stars</option>
            <option value="rarity">Sort: Rarity</option>
            <option value="name">Sort: Name</option>
            <option value="element">Sort: Element</option>
          </select>
        </div>
        <div id="roster-grid"></div>
      </div>
    </section>

    <!-- ================= Blacksmith screen ================= -->
    <section id="screen-blacksmith" class="screen hidden">
      <div id="bs-toolbar">
        <div id="bs-filters"></div>
        <div id="bs-bulk">
          <select id="bs-bulk-rarity" title="Salvage all unequipped items below this rarity">
            <option value="uncommon">below Uncommon</option>
            <option value="rare" selected>below Rare</option>
            <option value="epic">below Epic</option>
            <option value="legendary">below Legendary</option>
          </select>
          <button id="bs-bulk-salvage" class="panel-btn danger">Salvage all</button>
          <span id="bs-toolbar-msg"></span>
        </div>
      </div>
      <div id="bs-main">
        <div id="bs-list"></div>
        <aside id="bs-detail"></aside>
      </div>
    </section>

    <!-- ================= Quests screen ================= -->
    <section id="screen-quests" class="screen hidden">
      <div id="quest-boards"></div>
    </section>

    <!-- ================= Battle screen ================= -->
    <section id="screen-battle" class="screen hidden">
      <div id="battle-wrap">
        <canvas id="battle-canvas" width="960" height="540"></canvas>

        <button id="auto-btn" class="panel-btn" title="Let your heroes fight automatically">Auto: OFF</button>
        <button id="speed-btn" class="panel-btn hidden" title="Battle speed (auto-battle only)">Speed: 1×</button>

        <!-- Ability bar: shown when it's a player hero's turn -->
        <div id="ability-bar" class="hidden">
          <div id="active-hero-name"></div>
          <div id="ability-buttons"></div>
          <div id="target-hint" class="hidden">Select a target…</div>
        </div>

        <!-- End-of-battle banner -->
        <div id="battle-banner" class="hidden">
          <div id="banner-title"></div>
          <div id="banner-sub"></div>
          <div id="banner-actions">
            <button id="banner-retry" class="panel-btn hidden">Retry</button>
            <button id="banner-next" class="panel-btn gold hidden">Next Stage</button>
            <button id="banner-return" class="panel-btn gold">Return to Team</button>
          </div>
        </div>
      </div>

      <!-- Battle log -->
      <div id="battle-log"></div>
    </section>
  </div>

  <script src="js/config.js?v=49cc15d3"></script>
  <script src="js/hex.js?v=49cc15d3"></script>
  <script src="js/elements.js?v=49cc15d3"></script>
  <script src="js/races.js?v=49cc15d3"></script>
  <script src="js/sprites.js?v=49cc15d3"></script>
  <script src="js/abilities.js?v=49cc15d3"></script>
  <script src="js/progression.js?v=49cc15d3"></script>
  <script src="js/gear.js?v=49cc15d3"></script>
  <script src="js/hero.js?v=49cc15d3"></script>
  <script src="js/data/heroes.js?v=49cc15d3"></script>
  <script src="js/data/enemies.js?v=49cc15d3"></script>
  <script src="js/data/bosses.js?v=49cc15d3"></script>
  <script src="js/data/effects.js?v=49cc15d3"></script>
  <script src="js/quests.js?v=49cc15d3"></script>
  <script src="js/state.js?v=49cc15d3"></script>
  <script src="js/gacha.js?v=49cc15d3"></script>
  <script src="js/battle.js?v=49cc15d3"></script>
  <script src="js/render.js?v=49cc15d3"></script>
  <script src="js/ui.js?v=49cc15d3"></script>
  <script src="js/battle_screen.js?v=49cc15d3"></script>
  <script src="js/team_screen.js?v=49cc15d3"></script>
  <script src="js/blacksmith_screen.js?v=49cc15d3"></script>
  <script src="js/quests_screen.js?v=49cc15d3"></script>
  <script src="js/summon_screen.js?v=49cc15d3"></script>
  <script src="js/main.js?v=49cc15d3"></script>
</body>
</html>
