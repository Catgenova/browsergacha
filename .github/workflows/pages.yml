name: Deploy to GitHub Pages

# Publishes the site by syncing main to the gh-pages branch, which GitHub
# Pages serves. (The Actions-based Pages deploy needs Pages admin rights the
# workflow token doesn't have; branch deploys only need contents: write.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the version number (commit count) is right
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests before publishing
        run: node test/run.js
      - name: Stamp version and asset hashes
        run: |
          VERSION=$(git rev-list --count HEAD)
          sed -i "s/__VERSION__/${VERSION}/g; s/__BUILD__/${GITHUB_SHA::8}/g" index.html
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
