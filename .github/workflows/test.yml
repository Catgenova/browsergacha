name: Tests

# Guards the roster invariants (no duplicate skills or passives, no
# broken text, every hook actually runs) on every push and PR. These
# run in plain Node — no browser needed.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        run: node test/run.js
